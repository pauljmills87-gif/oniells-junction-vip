<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07130d" />
  <meta name="description" content="VIP Loyalty App for O'Neills Vilamoura Marina and The Junction Roadhouse Almancil." />
  <title>VIP Loyalty App | O'Neills & The Junction</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
  <script src="admin-access.js" defer></script>
  <link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/vip-180.png">
<script src="/vip-install.js" defer></script>
</head>
<body>
  <main id="app">
    <!-- Existing, approved home graphic. Two REAL clickable buttons overlay the printed artwork. -->
    <section class="home-screen" id="home-screen" aria-label="Choose your venue">
      <div class="home-artwork">
        <img src="assets/vip-home.png" alt="VIP Loyalty App. Choose your venue." draggable="false" />
        <button class="venue-hitarea venue-oneills" type="button" data-venue="oneills" aria-label="O'Neills, Vilamoura Marina"></button>
        <button class="venue-hitarea venue-junction" type="button" data-venue="junction" aria-label="The Junction Roadhouse, Almancil"></button>
      </div>
    </section>

    <!-- Each venue gets its OWN background, exact logo and accent colour. -->
    <section class="login-screen is-hidden" id="login-screen" aria-label="Member login">
      <div class="login-content">
        <button id="back-button" type="button" class="back-button" aria-label="Back to venue selection"><span aria-hidden="true">←</span> Choose venue</button>
        <header class="brand-header">
          <img class="venue-logo" id="venue-logo" src="assets/oneills-logo.png" alt="O'Neills Vilamoura Marina logo" />
          <p class="brand-eyebrow">VIP LOYALTY APP</p>
        </header>
        <section class="login-panel" aria-labelledby="login-title">
          <h1 id="login-title">Member Login</h1>
          <p class="login-intro">Enter your membership number and 4-digit PIN.</p>
          <form id="login-form" novalidate>
            <label for="member-number">Member number</label>
            <div class="field-shell"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><input id="member-number" type="text" placeholder="e.g. ON-0001" required autocapitalize="characters" maxlength="20" autocomplete="username" spellcheck="false" /></div>
            <label for="pin">4-digit PIN</label>
            <div class="field-shell"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="••••" required autocomplete="current-password" /><button type="button" class="pin-toggle" id="pin-toggle" aria-label="Show PIN" aria-pressed="false">Show</button></div>
            <button id="login-button" class="login-button" type="submit">LOG IN <span aria-hidden="true">→</span></button>
          </form>
          <button id="forgot-pin" type="button" class="forgot-pin">Forgot your PIN?</button>
          <p id="status-message" class="status-message" role="status" aria-live="polite">Design preview only. Secure login will be connected to Supabase next.</p>
        </section>
        <footer class="login-footer"><span class="footer-lock" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span> Your membership is private and secure</footer>
      </div>
    </section>
  </main>
</body>
</html>
